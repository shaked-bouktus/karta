name: Upload artifacts to GitHub Container Registry
on:
  push:
    branches: [ main ]
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write


jobs:
  build-and-push:
    name: Build & Push Helm Chart and Operator Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: |
            go.sum
            operator/go.sum
            cli/go.sum
            hack/release/go.sum

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Set package version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "Tag release: using the tag as the version (strip leading 'v' if present)"
            PACKAGE_VERSION=${GITHUB_REF_NAME#v}
          else
            echo "Push to main: dev build keyed off the commit sha"
            PACKAGE_VERSION=0.0.0-main-$(git rev-parse --short HEAD)
          fi
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION"

      - name: Set registry namespace
        run: |
          # Derive from the repo owner so a fork publishes to its own ghcr
          # namespace. ghcr requires lowercase, and an owner can be mixed case.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY_NAMESPACE="ghcr.io/${OWNER}/workload-map"
          echo "REGISTRY_NAMESPACE=$REGISTRY_NAMESPACE" >> $GITHUB_ENV
          echo "HELM_REGISTRY=$REGISTRY_NAMESPACE" >> $GITHUB_ENV
          echo "Publishing artifacts to $REGISTRY_NAMESPACE"

      - name: Verify version not already published
        run: |
          if helm show chart oci://${{ env.HELM_REGISTRY }}/karta --version "$PACKAGE_VERSION" >/dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION already published to ${{ env.HELM_REGISTRY }}/karta." >&2
            exit 1
          fi

      - name: Lint and validate helm chart
        run: make helm-lint helm-validate

      - name: Run checks
        if: github.ref_type == 'tag'
        run: make check VERSION="$PACKAGE_VERSION"

      - name: Validate synchronized module version
        if: github.ref_type == 'tag'
        run: make release-validate VERSION="$PACKAGE_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push operator image
        run: |
          make operator-image-buildx-push VERSION="$PACKAGE_VERSION" IMAGE_REGISTRY="$REGISTRY_NAMESPACE"

      - name: Generate air-gap image lock
        if: github.ref_type == 'tag'
        run: |
          # After the operator push so its tag resolves; PACKAGE_VERSION has no leading v.
          make image-lock VERSION="$PACKAGE_VERSION" \
            IMAGE_LOCK_SET="image.repository=$REGISTRY_NAMESPACE/karta-operator"

      - name: Build helm chart
        run: |
          helm package ./charts/karta -d ./charts \
            --version "$PACKAGE_VERSION" \
            --app-version "$PACKAGE_VERSION"

      - name: Push Helm Chart
        run: |
          helm push ./charts/karta-$PACKAGE_VERSION.tgz oci://${{ env.HELM_REGISTRY }}

      - name: Check Homebrew tap authentication
        id: tap-auth
        if: github.ref_type == 'tag'
        env:
          APP_CLIENT_ID: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          FALLBACK_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -n "$APP_CLIENT_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "use-app=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$FALLBACK_TOKEN" ]]; then
            echo "use-app=false" >> "$GITHUB_OUTPUT"
          else
            echo "A Homebrew tap GitHub App or HOMEBREW_TAP_TOKEN is required." >&2
            exit 1
          fi

      - name: Create Homebrew tap GitHub App token
        id: tap-token
        if: github.ref_type == 'tag' && steps.tap-auth.outputs.use-app == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: run-ai
          repositories: homebrew-tap
          permission-contents: write

      - name: Publish tagged CLI release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token || secrets.HOMEBREW_TAP_TOKEN }}
        run: make release VERSION="$PACKAGE_VERSION"

      - name: Attach chart and image locks to the GoReleaser release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "charts/karta-$PACKAGE_VERSION.tgz" \
            "dist/imagelock-karta-v$PACKAGE_VERSION-linux-amd64.yaml" \
            "dist/imagelock-karta-v$PACKAGE_VERSION-linux-arm64.yaml"
