# Throwaway probe, not for merge. It shows what a workflow can and cannot do
# to a protected branch with its own GITHUB_TOKEN, under a ruleset that
# mirrors upstream (pull request, signatures, CI check). Round 1 ran against
# main with the Write role as a bypass actor. Round 2 runs against the scratch
# branch probe-main with the github-actions[bot] user as a bypass actor.
name: Probe - direct commit to a protected branch with GITHUB_TOKEN
# Neutralized after the probe: manual-only so a push can never auto-fire it
# against a branch again (that is how it once hit an unprotected main).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: probe-main
          fetch-depth: 0

      - name: git CLI - empty commit pushed to the protected branch with GITHUB_TOKEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "probe: direct push to a protected branch with GITHUB_TOKEN"
          git push origin HEAD:probe-main

      - name: Contents API - commit to the protected branch with GITHUB_TOKEN (how GoReleaser commits)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/contents/probe.txt" \
            -f message="probe: API commit to a protected branch with GITHUB_TOKEN" \
            -f content="$(printf 'probe\n' | base64)" \
            -f branch=probe-main
