name: Pull Request

on:
  push:
    branches: [ main, v0.* ]
  pull_request:
    branches: [ main, v0.* ]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Isolate local act tools
        if: env.ACT == 'true'
        run: echo "LOCALBIN=/tmp/karta-bin" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.sum
            operator/go.sum
            cli/go.sum
            hack/release/go.sum

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Cache bin tools
        uses: actions/cache@v6
        with:
          path: |
            bin/controller-gen-*
            bin/go-licence-detector-*
            bin/golangci-lint-*
            bin/goreleaser-*
            bin/setup-envtest-*
            bin/k8s
          key: ${{ runner.os }}-tools-v1-${{ hashFiles('Makefile') }}-${{ hashFiles('go.mod') }}
          restore-keys: |
            ${{ runner.os }}-tools-v1-${{ hashFiles('Makefile') }}-
            ${{ runner.os }}-tools-v1-

      - name: Validate GoReleaser configuration
        run: make goreleaser-check

      - name: Run checks and build release executables
        run: |
          build_version="0.0.0-main-${GITHUB_SHA:0:7}"
          if [[ "${ACT:-}" == "true" ]]; then
            make worktree-fingerprint > /tmp/karta-tree-before-check
            make check VERSION="$build_version" VALIDATE_BASELINE=/tmp/karta-tree-before-check
          else
            make check VERSION="$build_version"
          fi

      - name: Lint helm chart
        run: make helm-lint

      - name: Validate helm chart renders
        run: make helm-validate

      - name: Verify air-gap image lock coverage
        run: make image-lock-verify

      - name: Test air-gap image lock generator
        run: make image-lock-test

      - name: Install shellcheck for act
        if: env.ACT == 'true'
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends shellcheck=0.8.0-2

      - name: Lint shell scripts
        run: make lint-shell

  headlamp-plugin-ci:
    name: Headlamp Plugin Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build Headlamp plugin
        run: make headlamp-plugin-build
